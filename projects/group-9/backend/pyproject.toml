[project]
name = "campusdesk"
version = "0.1.0"
description = "CampusDesk backend: booking rules, REST API, MCP server and agent"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.14",
    "python-dotenv>=1.2",
    "tzdata>=2024.1",
    "mcp>=2.3",
    "openai>=3.35",
    "httpx2>=2.13",
]

[dependency-groups]
dev = ["pytest>=9.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
