<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CampusDesk</title>
    <script>
      // Apply the saved theme before first paint so dark mode doesn't flash bright on reload.
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("campusdesk-theme") === "dark" ? "dark" : "light";
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
