<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClubOps progress</title>
<style>
  :root { --paper:#eef1f6; --surface:#fff; --ink:#14213d; --muted:#5b6577; --line:#d5dbe6; --done:#0f766e; --doing:#b7791f; }
  @media (prefers-color-scheme: dark) { :root { --paper:#0f1626; --surface:#172038; --ink:#e8ecf6; --muted:#9aa5bd; --line:#2a3556; --done:#4fd1c5; --doing:#e0a948; } }
  body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.5 "Avenir Next","Segoe UI",system-ui,sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 28px 20px; }
  h1 { margin:0 0 4px; letter-spacing:-0.02em; } .sub { color:var(--muted); margin:0 0 20px; }
  ol { list-style:none; margin:0; padding:0; }
  li { background:var(--surface); border:1px solid var(--line); border-left-width:6px; border-radius:8px; padding:12px 16px; margin-bottom:10px; }
  li.done { border-left-color:var(--done); } li.doing { border-left-color:var(--doing); }
  .t { display:flex; justify-content:space-between; gap:12px; font-weight:600; }
  .s { font-weight:400; color:var(--muted); font-size:14px; } .note { margin:6px 0 0; color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>ClubOps progress</h1>
  <p class="sub" id="sum"></p>
  <ol id="list"></ol>
</main>
<script id="progress-data" type="application/json">
[
  {
    "phase": 1,
    "title": "Set up the harness",
    "status": "todo",
    "date": "",
    "note": ""
  },
  {
    "phase": 2,
    "title": "Build the backend and the frontend",
    "status": "todo",
    "date": "",
    "note": ""
  },
  {
    "phase": 3,
    "title": "Test the behaviour",
    "status": "todo",
    "date": "",
    "note": ""
  },
  {
    "phase": 4,
    "title": "Make the MCP server and connect any agent",
    "status": "todo",
    "date": "",
    "note": ""
  },
  {
    "phase": 5,
    "title": "Add the agent to the UI",
    "status": "todo",
    "date": "",
    "note": ""
  },
  {
    "phase": 6,
    "title": "Write evals for the prompts",
    "status": "todo",
    "date": "",
    "note": ""
  },
  {
    "phase": 7,
    "title": "Add guardrails",
    "status": "todo",
    "date": "",
    "note": ""
  },
  {
    "phase": 8,
    "title": "Prepare the demo",
    "status": "todo",
    "date": "",
    "note": ""
  }
]
</script>
<script>
  const data = JSON.parse(document.getElementById('progress-data').textContent);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  document.getElementById('sum').textContent = `${data.filter((p) => p.status === 'done').length} of ${data.length} phases done`;
  document.getElementById('list').innerHTML = data.map((p) => `<li class="${p.status}">
    <div class="t"><span>Phase ${p.phase}: ${esc(p.title)}</span><span class="s">${p.status}${p.date ? ', ' + p.date : ''}</span></div>
    ${p.note ? `<p class="note">${esc(p.note)}</p>` : ''}</li>`).join('');
</script>
</body>
</html>
